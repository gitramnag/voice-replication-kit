[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-replication-kit"
version = "0.1.0"
description = "Reproducible CosyVoice workflow with a strict public/private boundary"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Voice Replication Kit contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "pytest==9.0.3",
  "setuptools==84.0.0",
]

[project.scripts]
voice-kit = "voice_replication_kit.cli:main"
voice-publication-check = "voice_replication_kit.privacy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
